<!doctype html>
<html lang="en-SG">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<meta
  name="theme-color"
  content="#fef8f1"
>

<meta
  name="description"
  content="Redeem your Grow Well SG token of appreciation."
>

<title>Grow Well SG – Token of Appreciation</title>


<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:wght@400;600;700;800;900&display=swap"
  rel="stylesheet"
>


<style>

:root {

  /* Exact background colour sampled from your Got 10 Minutes logo */
  --logo-bg:#fef8f1;

  --cream:#fff4e6;

  --ink:#2d2d2d;
  --body:#404040;

  --purple:#9146ff;
  --purple-dark:#7833e8;

  --title-font:
    "Lilita One",
    "Arial Rounded MT Bold",
    Arial,
    sans-serif;

  --body-font:
    "Nunito Sans",
    Arial,
    Helvetica,
    sans-serif;
}


*,
*::before,
*::after {
  box-sizing:border-box;
}


html {
  min-width:320px;
  background:var(--cream);
}


body {

  margin:0;

  min-height:100vh;
  min-height:100svh;

  color:var(--body);

  font-family:var(--body-font);

  /* No circles / gradients */
  background:var(--cream);
}



/* ==========================================
   TOP SECTION
   Same colour as Got 10 Minutes logo
========================================== */

.hero-band {

  width:100%;

  background:
    var(--logo-bg);
}


.hero {

  width:
    min(
      1180px,
      calc(100% - 36px)
    );

  max-width:980px;

  margin:0 auto;

  padding:
    clamp(34px,5vw,62px)
    0
    clamp(40px,5vw,58px);

  text-align:center;
}



/* ==========================================
   GOT 10 MINUTES LOGO
========================================== */

.got10-logo {

  display:block;

  width:
    clamp(
      210px,
      24vw,
      300px
    );

  height:auto;

  margin:
    0 auto 22px;
}



/* ==========================================
   MAIN TITLE
========================================== */

h1 {

  max-width:1000px;

  margin:0 auto;

  color:var(--ink);

  font-family:
    var(--title-font);

  font-size:
    clamp(
      3rem,
      7vw,
      5.8rem
    );

  font-weight:400;

  letter-spacing:.005em;

  line-height:.93;

  text-transform:uppercase;

  text-wrap:balance;
}


.discover-copy {

  max-width:820px;

  margin:
    24px auto 0;

  color:var(--body);

  font-size:
    clamp(
      1.05rem,
      1.8vw,
      1.3rem
    );

  line-height:1.55;
}


.discover-copy a {

  color:var(--purple-dark);

  font-weight:900;

  text-decoration:underline;

  text-decoration-thickness:2px;

  text-underline-offset:4px;
}


.discover-copy a:hover {

  color:var(--purple);
}



/* ==========================================
   LOWER CREAM SECTION
========================================== */

.content-section {

  background:
    var(--cream);

  padding:
    clamp(44px,6vw,72px)
    18px
    52px;
}



/* ==========================================
   E-BOOK CARD
========================================== */

.gift-card {

  display:grid;

  grid-template-columns:
    minmax(280px,.95fr)
    minmax(320px,1.05fr);

  width:
    min(
      1040px,
      100%
    );

  margin:0 auto;

  overflow:hidden;

  border:
    3px solid
    var(--ink);

  border-radius:28px;

  background:#ffffff;

  box-shadow:
    15px 14px 0
    var(--ink);
}



/* ==========================================
   BOOK SIDE
========================================== */

.book-side {

  position:relative;

  display:flex;

  align-items:stretch;

  justify-content:center;

  min-height:390px;

  overflow:hidden;

  background:#f5dedc;
}


.book-link {

  display:flex;

  width:100%;
  height:100%;

  align-items:center;

  justify-content:center;

  text-decoration:none;
}


.book-cover {

  display:block;

  width:100%;
  height:100%;

  min-height:390px;

  object-fit:cover;

  transition:
    transform .25s ease;
}


.book-link:hover
.book-cover {

  transform:
    scale(1.025);
}


.book-tag {

  position:absolute;

  left:22px;
  bottom:20px;

  padding:
    9px 15px;

  border-radius:
    999px;

  color:#ffffff;

  background:
    rgba(45,45,45,.92);

  font-size:.8rem;

  font-weight:900;

  letter-spacing:.04em;

  pointer-events:none;
}



/* ==========================================
   RIGHT SIDE
========================================== */

.gift-copy {

  display:flex;

  flex-direction:column;

  justify-content:center;

  padding:
    clamp(
      30px,
      5vw,
      54px
    );
}



/* ==========================================
   SMALLER STORY HEADING

   This is intentionally much smaller than
   your main title, closer to the GWSG card
   heading scale in your screenshot.
========================================== */

.gift-copy h2 {

  max-width:520px;

  margin:0;

  color:var(--ink);

  font-family:
    var(--title-font);

  font-size:
    clamp(
      1.45rem,
      2.25vw,
      2rem
    );

  font-weight:400;

  line-height:1.08;
}


.story-copy {

  margin:
    20px 0 0;

  color:var(--body);

  font-size:
    clamp(
      1.05rem,
      1.65vw,
      1.25rem
    );

  line-height:1.55;
}



/* ==========================================
   DOWNLOAD BUTTON
========================================== */

.download-button {

  display:inline-flex;

  width:fit-content;

  min-height:58px;

  align-items:center;

  justify-content:center;

  margin-top:28px;

  padding:
    14px 28px;

  border-radius:11px;

  color:#ffffff;

  background:
    var(--purple);

  font-family:
    var(--body-font);

  font-size:
    clamp(
      1rem,
      1.6vw,
      1.18rem
    );

  font-weight:900;

  letter-spacing:.025em;

  text-decoration:none;

  text-transform:uppercase;

  box-shadow:
    0 5px 0
    rgba(75,33,130,.22);

  transition:
    transform .16s ease,
    background .16s ease,
    box-shadow .16s ease;
}


.download-button:hover {

  background:
    var(--purple-dark);

  transform:
    translateY(-2px);

  box-shadow:
    0 7px 0
    rgba(75,33,130,.22);
}


.download-button:active {

  transform:
    translateY(1px);

  box-shadow:
    0 3px 0
    rgba(75,33,130,.22);
}



/* ==========================================
   FOOTER
========================================== */

.footer {

  width:
    min(
      900px,
      calc(100% - 36px)
    );

  margin:
    48px auto 0;

  padding-top:20px;

  border-top:
    1px solid
    rgba(45,45,45,.14);

  color:#707070;

  font-size:.82rem;

  text-align:center;
}



/* ==========================================
   TABLET
========================================== */

@media(max-width:820px) {

  .gift-card {

    grid-template-columns:1fr;

    box-shadow:
      10px 10px 0
      var(--ink);
  }


  .book-side {

    min-height:0;
  }


  .book-cover {

    min-height:0;

    max-height:430px;

    object-fit:cover;
  }

}



/* ==========================================
   MOBILE
========================================== */

@media(max-width:560px) {

  .hero {

    width:
      min(
        100% - 24px,
        520px
      );

    padding-top:26px;
  }


  .got10-logo {

    width:210px;
  }


  h1 {

    font-size:
      clamp(
        2.65rem,
        14vw,
        4rem
      );
  }


  .content-section {

    padding-left:12px;
    padding-right:12px;
  }


  .gift-card {

    border-radius:22px;

    box-shadow:
      7px 8px 0
      var(--ink);
  }


  .gift-copy {

    padding:
      28px 24px
      30px;
  }


  .gift-copy h2 {

    font-size:
      1.5rem;
  }


  .download-button {

    width:100%;
  }


  .book-tag {

    left:15px;
    bottom:14px;
  }

}


@media(prefers-reduced-motion:reduce) {

  *,
  *::before,
  *::after {

    transition-duration:
      .01ms !important;
  }

}

</style>

</head>
