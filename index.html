<!doctype html>
<html lang="en-SG">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<meta
  name="theme-color"
  content="#fffaf6"
>

<meta
  name="description"
  content="Redeem your Grow Well SG token of appreciation."
>

<title>Grow Well SG – Token of Appreciation</title>


<style>

:root {

  --ink:#303036;
  --muted:#66666f;
  --paper:#fffaf6;

  --pink:#f4163e;
  --orange:#f58a1f;
  --teal:#00aaa6;
  --yellow:#f4cc09;

  /* Purple used for the main heading */
  --purple:#7451a6;

  /*
    Rounded, friendly font stack.
    No external font download is required.
  */
  --rounded:
    "Arial Rounded MT Bold",
    "Trebuchet MS",
    ui-rounded,
    Arial,
    sans-serif;

  --body:
    Arial,
    Helvetica,
    sans-serif;
}


*,
*::before,
*::after {
  box-sizing:border-box;
}


html {
  min-width:320px;
  background:var(--paper);
}


body {

  min-height:100vh;
  min-height:100svh;

  margin:0;

  overflow-x:hidden;

  color:var(--ink);

  font-family:var(--body);

  background:

    radial-gradient(
      circle at 7% 8%,
      rgba(0,170,166,.10) 0 90px,
      transparent 91px
    ),

    radial-gradient(
      circle at 92% 10%,
      rgba(244,204,9,.14) 0 118px,
      transparent 119px
    ),

    radial-gradient(
      circle at 95% 94%,
      rgba(244,22,62,.08) 0 155px,
      transparent 156px
    ),

    linear-gradient(
      180deg,
      #ffffff 0%,
      var(--paper) 100%
    );
}


body::before,
body::after {

  position:fixed;

  z-index:-1;

  width:190px;
  height:190px;

  border-radius:
    48% 52% 63% 37% /
    41% 45% 55% 59%;

  content:"";

  pointer-events:none;
}


body::before {

  top:-92px;
  left:-62px;

  background:
    rgba(245,138,31,.10);

  transform:
    rotate(22deg);
}


body::after {

  right:-82px;
  bottom:-94px;

  background:
    rgba(0,158,226,.08);

  transform:
    rotate(-18deg);
}


.page {

  width:
    min(
      1080px,
      calc(100% - 32px)
    );

  margin:0 auto;

  padding:
    clamp(30px,5vw,58px)
    0
    34px;
}



/* ==========================================
   HEADER
========================================== */

.hero {

  max-width:900px;

  margin:
    0 auto
    clamp(36px,5vw,52px);

  text-align:center;
}


.logo {

  display:block;

  width:125px;

  max-width:34vw;

  height:auto;

  margin:
    0 auto 26px;
}


.eyebrow {

  margin:
    0 0 14px;

  color:#008f8b;

  font-family:
    var(--rounded);

  font-size:
    clamp(
      .78rem,
      1.5vw,
      .94rem
    );

  font-weight:900;

  letter-spacing:.12em;

  line-height:1.4;

  text-transform:uppercase;
}



/* ==========================================
   PURPLE CURVY MAIN HEADING
========================================== */

h1 {

  max-width:850px;

  margin:0 auto;

  color:var(--purple);

  font-family:
    var(--rounded);

  font-size:
    clamp(
      2.6rem,
      6vw,
      5rem
    );

  font-weight:900;

  letter-spacing:-.045em;

  line-height:1;

  text-wrap:balance;
}


/*
  Slight soft shadow gives it a warmer,
  campaign-style appearance.
*/

h1 {
  text-shadow:
    0 3px 0
    rgba(116,81,166,.07);
}


.subtitle {

  max-width:760px;

  margin:
    22px auto 0;

  color:var(--muted);

  font-size:
    clamp(
      1.05rem,
      2vw,
      1.22rem
    );

  font-weight:700;

  line-height:1.55;
}


.subtitle a {

  color:#008f8b;

  font-weight:900;

  text-decoration:underline;

  text-decoration-thickness:2px;

  text-underline-offset:3px;
}


.subtitle a:hover {

  color:#006f6c;
}



/* ==========================================
   SINGLE GIFT CARD
========================================== */

.actions {

  display:flex;

  justify-content:center;

  max-width:900px;

  margin:0 auto;
}


.gift-card {

  --accent:var(--pink);
  --soft:rgba(244,22,62,.07);
  --strong:rgba(244,22,62,.16);

  position:relative;

  display:flex;

  width:min(100%,650px);

  min-height:285px;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:20px;

  padding:
    38px 32px;

  overflow:hidden;

  border:
    2px solid
    var(--accent);

  border-radius:34px;

  color:var(--ink);

  text-decoration:none;

  text-align:center;

  background:

    linear-gradient(
      145deg,
      #ffffff 0%,
      #ffffff 60%,
      var(--soft) 100%
    );

  box-shadow:
    0 18px 44px
    rgba(48,48,54,.09);

  isolation:isolate;

  cursor:pointer;

  transition:
    transform .18s ease,
    box-shadow .18s ease;

  -webkit-tap-highlight-color:
    transparent;
}


.gift-card::before {

  position:absolute;

  z-index:-1;

  top:-64px;

  right:-52px;

  width:170px;

  height:170px;

  border-radius:50%;

  content:"";

  background:
    var(--strong);

  transition:
    transform .22s ease;
}


.gift-card::after {

  position:absolute;

  z-index:-1;

  bottom:-60px;

  left:-46px;

  width:115px;

  height:115px;

  border:
    20px solid
    var(--soft);

  border-radius:50%;

  content:"";
}


.gift-card:hover {

  transform:
    translateY(-7px);

  box-shadow:
    0 26px 58px
    rgba(48,48,54,.15);
}


.gift-card:hover::before {

  transform:
    scale(1.12);
}


.gift-card:focus-visible {

  outline:
    4px solid
    var(--ink);

  outline-offset:5px;
}



/* ==========================================
   GIFT ICON
========================================== */

.icon-wrap {

  display:grid;

  width:92px;
  height:92px;

  place-items:center;

  border-radius:26px;

  background:
    rgba(244,22,62,.07);
}


.icon {

  width:66px;
  height:66px;

  overflow:visible;
}



/* ==========================================
   NEW LARGE CARD TEXT
========================================== */

.redeem-text {

  margin:0;

  color:var(--pink);

  font-family:
    var(--rounded);

  font-size:
    clamp(
      2rem,
      4vw,
      3rem
    );

  font-weight:900;

  letter-spacing:-.025em;

  line-height:1.08;
}



/* ==========================================
   SMALL HOVER HINT
========================================== */

.gift-card:hover .redeem-text {

  transform:
    scale(1.02);
}


.redeem-text {

  transition:
    transform .18s ease;
}



/* ==========================================
   FOOTER
========================================== */

.footer {

  margin-top:
    clamp(
      40px,
      6vw,
      62px
    );

  padding-top:18px;

  border-top:
    1px solid
    rgba(48,48,54,.08);

  color:#777780;

  font-size:.82rem;

  text-align:center;
}



/* ==========================================
   MOBILE
========================================== */

@media(max-width:720px) {

  .page {

    width:
      min(
        100% - 24px,
        560px
      );

    padding-top:24px;
  }


  .logo {

    width:105px;
  }


  .hero {

    margin-bottom:30px;
  }


  h1 {

    font-size:
      clamp(
        2.35rem,
        12vw,
        3.6rem
      );
  }


  .gift-card {

    min-height:245px;

    padding:
      30px 22px;

    border-radius:28px;
  }


  .icon-wrap {

    width:80px;
    height:80px;

    border-radius:22px;
  }


  .icon {

    width:58px;
    height:58px;
  }


  .redeem-text {

    font-size:
      clamp(
        1.85rem,
        8vw,
        2.5rem
      );
  }

}



@media(prefers-reduced-motion:reduce) {

  *,
  *::before,
  *::after {

    transition-duration:
      .01ms !important;
  }

}

</style>

</head>



<body>


<main class="page">


<header class="hero">


<!-- ==========================================
     OFFICIAL GROW WELL SG LOGO
========================================== -->

<img
  class="logo"
  alt="Grow Well SG logo"
  src="https://ch-api.healthhub.sg/api/public/content/24908b7d99c6494b8bfec7da596157c6?v=d7bd063e"
>


<p class="eyebrow">

  GOT 10 MINUTES? LET’S GROW WELL TOGETHER!

</p>



<h1>

  Redeem your token of appreciation

</h1>



<p class="subtitle">

  Enjoy your gift, then

  <a
    href="https://go.gov.sg/grow-well-sg-main-page"
    target="_blank"
    rel="noopener noreferrer"
  >
    discover more 10 minutes activities
  </a>

  to stay healthy with Grow Well SG.

</p>


</header>



<section
  class="actions"
  aria-label="Redeem your gift"
>


<!-- ==========================================
     SINGLE REDEMPTION BOX

     The whole box links to the e-book.
========================================== -->

<a
  class="gift-card"
  href="https://go.gov.sg/e-book"
  target="_blank"
  rel="noopener noreferrer"
  aria-label="Tap to redeem your gift"
>


<!-- GIFT ICON -->

<div
  class="icon-wrap"
  aria-hidden="true"
>


<svg
  class="icon"
  viewBox="0 0 96 96"
>


<rect
  x="16"
  y="34"
  width="64"
  height="47"
  rx="8"
  fill="#f4163e"
/>


<rect
  x="11"
  y="27"
  width="74"
  height="18"
  rx="7"
  fill="#ffcf4a"
/>


<rect
  x="43"
  y="27"
  width="10"
  height="54"
  fill="#ffffff"
/>


<path
  d="M48 27c-14-4-21-9-21-16 0-5 4-8 9-8 8 0 12 8 12 24Z"
  fill="#ee4d9b"
/>


<path
  d="M48 27c14-4 21-9 21-16 0-5-4-8-9-8-8 0-12 8-12 24Z"
  fill="#00aaa6"
/>


<path
  d="M48 27v54"
  stroke="#ffffff"
  stroke-width="4"
/>


</svg>


</div>



<!-- ONLY TEXT INSIDE CARD -->

<p class="redeem-text">

  Tap to redeem your gift

</p>


</a>


</section>



<footer class="footer">

  Grow Well SG resource gateway for event participants

</footer>


</main>


</body>

</html>
